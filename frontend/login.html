<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Applicant Sign In | Passport Automation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true">◎</span>Passport Automation</a>
  <nav class="nav"><a href="index.html">Home</a><a href="register.html">Create account</a></nav>
</header>
<main>
  <section class="form-card">
    <p class="eyebrow">Applicant portal</p>
    <h1 class="page-title">Welcome back</h1>
    <p class="sub">Sign in to view your applications or start a new one.</p>
    <div id="message" class="message" role="status" aria-live="polite"></div>
    <form id="loginForm">
      <label class="full">Email address<input name="email" type="email" required autocomplete="username"></label>
      <label class="full">Password<input name="password" type="password" required autocomplete="current-password"></label>
      <div class="full">
        <button class="btn" type="submit">Sign in</button>
        <a href="register.html">Create an account</a>
      </div>
    </form>
    <p class="sub separate-login">Passport officer? <a href="admin-login.html">Use officer sign in</a>.</p>
  </section>
</main>
<footer>Educational prototype only · Do not enter real identity details</footer>
<script src="app.js"></script>
</body>
</html>
