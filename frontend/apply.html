<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apply | Passport Automation</title><link rel="stylesheet" href="style.css"></head><body><header><a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true">◎</span>Passport Automation</a><nav class="nav"><a href="index.html">Home</a><a href="track.html">Track</a><span id="userNav"></span></nav></header><main><section class="form-card"><h1 class="page-title">Passport Application</h1><p class="sub">Fill in sample details for this educational demo. Do not use real sensitive data.</p><div class="notice">You must register and log in before submitting an application.</div><form id="applyForm"><label>Full name<input name="fullName" required></label><label>Date of birth<input name="dob" type="date" required></label><label>Gender<select name="gender" required><option value="">Choose...</option><option>Female</option><option>Male</option><option>Other</option><option>Prefer not to say</option></select></label><label>Email<input id="email" name="email" type="email" required></label><label>Phone number<input name="phone" type="tel" required></label><label>Application type<select name="applicationType" required><option value="">Choose...</option><option>Fresh Passport</option><option>Passport Renewal</option></select></label><label class="full">Address<textarea name="address" required></textarea></label><label class="full">Document file (demo only)<input id="documentFile" type="file" accept=".pdf,.jpg,.jpeg,.png"><span class="help">Only the filename is recorded; the file is not uploaded to a server.</span></label><div class="full"><button class="btn" type="submit">Submit Application</button></div></form></section></main><footer>Educational prototype only</footer><script src="app.js"></script></body></html>
